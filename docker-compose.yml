services:
  db:
    image: postgres:15-alpine
    container_name: software2_db
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: mi_base_de_datos
    ports:
      - "5435:5432" # Usamos el 5435 para evitar conflictos en Windows
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: